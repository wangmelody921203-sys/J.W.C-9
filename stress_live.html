<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>壓力感測即時波動 | EmotionSense AI</title>
  <style>
    :root {
      --bg: #071019;
      --panel: rgba(13, 21, 33, 0.86);
      --line: rgba(255, 255, 255, 0.1);
      --text: #eef3fb;
      --muted: #9eb2cb;
      --low: #45d98f;
      --mid: #f5be52;
      --high: #ef6b6b;
      --stale: #95a3b8;
      --accent: #67b2ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(103, 178, 255, 0.18), transparent 25%),
        radial-gradient(circle at 85% 8%, rgba(69, 217, 143, 0.12), transparent 22%),
        linear-gradient(180deg, #060d15, #0a1422);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .page {
      width: min(1120px, calc(100% - 30px));
      margin: 22px auto 34px;
      display: grid;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(14px);
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .link-btn {
      text-decoration: none;
      color: #051120;
      background: linear-gradient(135deg, #7dd5ff, #67b2ff);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.start { background: #1f8f53; color: #e9fff3; }
    .btn.stop { background: #384456; color: #e3e9f4; }

    .stats {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 10px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      min-height: 96px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .value {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .value.small { font-size: 24px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--stale);
      box-shadow: 0 0 0 6px rgba(149, 163, 184, 0.15);
    }

    .chart-wrap {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(2, 7, 14, 0.54);
      padding: 10px;
    }

    #stress-chart {
      width: 100%;
      height: 300px;
      display: block;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .sub-control {
      margin-top: 10px;
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
      align-items: center;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .sub-control { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .value { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel hero">
      <div>
        <h1>壓力感測即時波動面板</h1>
        <p>登入後連接自己的 Arduino，感測資料只會存入自己的帳戶。</p>
      </div>
      <a class="link-btn" href="./home.html">回首頁</a>
    </section>

    <section class="panel">
      <div style="display:flex; flex-wrap:wrap; gap:10px;">
        <button id="connect-btn" class="btn start" type="button">連接我的壓力感測器</button>
        <button id="disconnect-btn" class="btn stop" type="button" disabled>中斷裝置</button>
      </div>
      <p class="hint" style="margin:10px 0 0;">需先在掃描頁登入，使用最新版 Chrome 或 Edge，並以 USB 將 Arduino 接到這台電腦。瀏覽器跳出裝置選擇時，選 Arduino Uno。支援透過 HTTPS 網站連線。</p>
    </section>

    <section class="panel">
      <div class="stats">
        <article class="card">
          <div class="label">壓力分數</div>
          <div id="score-value" class="value">--</div>
        </article>
        <article class="card">
          <div class="label">壓力等級</div>
          <div id="level-value" class="value small">未知</div>
        </article>
        <article class="card">
          <div class="label">原始感測值</div>
          <div id="sensor-value" class="value small">--</div>
        </article>
        <article class="card">
          <div class="label">最後更新</div>
          <div id="updated-value" class="value small">--</div>
        </article>
      </div>
      <div style="margin-top:12px;">
        <span class="status-pill"><span id="status-dot" class="dot"></span><span id="status-text">尚未啟動監測</span></span>
      </div>
    </section>

    <section class="panel chart-wrap">
      <canvas id="stress-chart" width="1000" height="300"></canvas>
      <p class="hint" style="margin:10px 2px 2px;">圖上顯示最近 120 秒壓力分數（0~100），顏色隨等級變化：低=綠，中=黃，高=紅。</p>
    </section>
  </main>

  <script>
    const DEFAULT_API_BASE = "https://j-w-c-9.onrender.com";
    const AUTH_TOKEN_SHARE_KEY = "emotion.auth.access_token";
    const MAX_POINTS = 120;
    const HISTORY_BOOTSTRAP_LIMIT = 120;

    const connectBtn = document.getElementById("connect-btn");
    const disconnectBtn = document.getElementById("disconnect-btn");
    const scoreValue = document.getElementById("score-value");
    const levelValue = document.getElementById("level-value");
    const sensorValue = document.getElementById("sensor-value");
    const updatedValue = document.getElementById("updated-value");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const chart = document.getElementById("stress-chart");
    const ctx = chart.getContext("2d");

    let points = [];
    let serialPort = null;
    let serialReader = null;
    let serialReadTask = null;
    let serialStopping = false;

    function resolveAuthToken() {
      return String(localStorage.getItem(AUTH_TOKEN_SHARE_KEY) || "").trim();
    }

    function colorByLevel(level, stale) {
      if (stale) return getComputedStyle(document.documentElement).getPropertyValue("--stale").trim();
      if (level === "high") return getComputedStyle(document.documentElement).getPropertyValue("--high").trim();
      if (level === "medium") return getComputedStyle(document.documentElement).getPropertyValue("--mid").trim();
      return getComputedStyle(document.documentElement).getPropertyValue("--low").trim();
    }

    function levelText(level) {
      if (level === "high") return "高";
      if (level === "medium") return "中";
      if (level === "low") return "低";
      return "未知";
    }

    function setStatus(message, color) {
      statusText.textContent = message;
      statusDot.style.background = color;
      statusDot.style.boxShadow = `0 0 0 6px ${color}33`;
    }

    function formatTime(unixSeconds) {
      const d = new Date(unixSeconds * 1000);
      if (Number.isNaN(d.getTime())) return "--";
      return d.toLocaleTimeString("zh-TW", { hour12: false });
    }

    function updateCards(payload) {
      const score = Number(payload.stress_score ?? 0);
      const level = String(payload.stress_level || "unknown").toLowerCase();
      const stale = Boolean(payload.is_stale);
      const sensor = Number(payload.sensor_value ?? 0);

      scoreValue.textContent = Number.isFinite(score) ? String(Math.max(0, Math.min(100, Math.round(score)))) : "--";
      levelValue.textContent = levelText(level) + (stale ? "（中斷）" : "");
      sensorValue.textContent = Number.isFinite(sensor) ? String(Math.max(0, Math.min(1023, Math.round(sensor)))) : "--";
      updatedValue.textContent = formatTime(Number(payload.timestamp || 0));

      const color = colorByLevel(level, stale);
      setStatus(stale ? "感測資料中斷或過舊" : "感測資料正常更新", color);
    }

    function addPoint(payload) {
      const score = Number(payload.stress_score ?? 0);
      const level = String(payload.stress_level || "unknown").toLowerCase();
      const stale = Boolean(payload.is_stale);
      const ts = Number(payload.timestamp || 0);
      points.push({
        ts: ts > 0 ? ts * 1000 : Date.now(),
        score: Number.isFinite(score) ? Math.max(0, Math.min(100, score)) : 0,
        level,
        stale,
      });
      if (points.length > MAX_POINTS) {
        points = points.slice(points.length - MAX_POINTS);
      }
    }

    function buildStressRequest() {
      const token = resolveAuthToken();
      const headers = token ? { Authorization: `Bearer ${token}` } : {};
      return {
        latestUrl: `${DEFAULT_API_BASE}/stress/user/latest`,
        historyUrl: `${DEFAULT_API_BASE}/stress/user/history?limit=${HISTORY_BOOTSTRAP_LIMIT}`,
        reportUrl: `${DEFAULT_API_BASE}/stress/user/report`,
        headers,
      };
    }

    function loadHistoryPoints(entries) {
      if (!Array.isArray(entries) || !entries.length) {
        return 0;
      }

      const sorted = entries
        .filter((entry) => entry && typeof entry === "object")
        .sort((a, b) => Number(a.timestamp || 0) - Number(b.timestamp || 0));

      points = [];
      sorted.forEach((entry) => addPoint(entry));
      return points.length;
    }

    async function bootstrapHistory() {
      const req = buildStressRequest();
      if (!req.headers.Authorization) {
        setStatus("請先到掃描頁登入，再連接個人裝置", "#95a3b8");
        return;
      }

      try {
        const res = await fetch(req.historyUrl, { cache: "no-store", headers: req.headers });
        if (!res.ok) {
          return;
        }
        const payload = await res.json();
        const loadedCount = loadHistoryPoints(payload.entries);
        if (loadedCount > 0) {
          updateCards(payload.entries[payload.entries.length - 1]);
          drawChart();
          setStatus(`已載入 ${loadedCount} 筆歷史資料`, "#67b2ff");
        }
      } catch (_err) {
        // Ignore history bootstrap failures and continue live polling.
      }
    }

    function drawChart() {
      const w = chart.clientWidth;
      const h = chart.clientHeight;
      if (chart.width !== w || chart.height !== h) {
        chart.width = w;
        chart.height = h;
      }

      ctx.clearRect(0, 0, w, h);

      const padL = 42;
      const padR = 20;
      const padT = 16;
      const padB = 28;
      const gw = w - padL - padR;
      const gh = h - padT - padB;

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i += 1) {
        const y = padT + (gh * i) / 5;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
      }

      ctx.fillStyle = "#9eb2cb";
      ctx.font = "12px Noto Sans TC";
      for (let i = 0; i <= 5; i += 1) {
        const v = 100 - i * 20;
        const y = padT + (gh * i) / 5;
        ctx.fillText(String(v), 8, y + 4);
      }

      if (!points.length) {
        ctx.fillStyle = "#9eb2cb";
        ctx.fillText("尚無資料，請先開始監測。", padL + 8, padT + 20);
        return;
      }

      ctx.lineWidth = 2.2;
      ctx.beginPath();
      points.forEach((point, i) => {
        const x = padL + (gw * i) / Math.max(1, points.length - 1);
        const y = padT + gh * (1 - point.score / 100);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      const last = points[points.length - 1];
      ctx.strokeStyle = colorByLevel(last.level, last.stale);
      ctx.stroke();

      const lastX = padL + (gw * (points.length - 1)) / Math.max(1, points.length - 1);
      const lastY = padT + gh * (1 - last.score / 100);
      ctx.fillStyle = colorByLevel(last.level, last.stale);
      ctx.beginPath();
      ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    async function loadLatest() {
      const req = buildStressRequest();
      if (!req.headers.Authorization) {
        setStatus("請先登入，資料才會安全存入個人帳戶", "#95a3b8");
        return;
      }

      try {
        const res = await fetch(req.latestUrl, { cache: "no-store", headers: req.headers });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        updateCards(data);
        addPoint(data);
        drawChart();
      } catch (err) {
        setStatus(`連線失敗：${err.message || "unknown"}`, "#95a3b8");
      }
    }

    function payloadFromSensorValue(value) {
      const sensorValue = Math.max(0, Math.min(1023, Math.round(value)));
      const normalized = sensorValue / 1023;
      const stressScore = Math.round(normalized * 100);
      return {
        source: "browser_serial_fsr",
        timestamp: Math.floor(Date.now() / 1000),
        is_stale: false,
        sensor_value: sensorValue,
        smoothed_value: sensorValue,
        normalized,
        stress_score: stressScore,
        stress_level: stressScore >= 70 ? "high" : stressScore >= 40 ? "medium" : "low",
      };
    }

    async function reportSensorValue(value) {
      const payload = payloadFromSensorValue(value);
      updateCards(payload);
      addPoint(payload);
      drawChart();

      const req = buildStressRequest();
      try {
        const response = await fetch(req.reportUrl, {
          method: "POST",
          headers: { ...req.headers, "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (error) {
        setStatus(`資料上傳失敗：${error.message || "請檢查登入狀態"}`, "#95a3b8");
      }
    }

    async function readSerialStream() {
      const decoder = new TextDecoderStream();
      const pipeClosed = serialPort.readable.pipeTo(decoder.writable).catch((error) => {
        if (!serialStopping) throw error;
      });
      serialReader = decoder.readable.getReader();
      let buffer = "";

      try {
        while (!serialStopping) {
          const { value, done } = await serialReader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || "";
          for (const line of lines) {
            const match = line.trim().match(/^-?\d+$/);
            if (match) {
              await reportSensorValue(Number(match[0]));
            }
          }
        }
      } finally {
        serialReader.releaseLock();
        serialReader = null;
        await pipeClosed;
      }
    }

    async function connectSensor() {
      if (!("serial" in navigator)) {
        setStatus("此瀏覽器不支援序列埠，請改用最新版 Chrome 或 Edge", "#ef6b6b");
        return;
      }
      if (!resolveAuthToken()) {
        setStatus("請先到掃描頁登入，再連接個人裝置", "#ef6b6b");
        return;
      }

      try {
        serialStopping = false;
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 9600 });
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        setStatus("裝置已連線，等待感測資料…", "#67b2ff");
        serialReadTask = readSerialStream();
        serialReadTask.catch((error) => {
          if (!serialStopping) {
            setStatus(`裝置讀取失敗：${error.message || "請重新連線"}`, "#ef6b6b");
          }
        }).finally(async () => {
          serialReadTask = null;
          connectBtn.disabled = false;
          disconnectBtn.disabled = true;
          if (serialPort?.readable) {
            await serialPort.close().catch(() => {});
          }
          serialPort = null;
        });
      } catch (error) {
        setStatus(`無法連接裝置：${error.message || "已取消或裝置忙碌"}`, "#ef6b6b");
      }
    }

    async function disconnectSensor() {
      serialStopping = true;
      if (serialReader) {
        await serialReader.cancel().catch(() => {});
      }
      if (serialReadTask) {
        await serialReadTask.catch(() => {});
      }
      if (serialPort?.readable) {
        await serialPort.close().catch(() => {});
      }
      serialPort = null;
      connectBtn.disabled = false;
      disconnectBtn.disabled = true;
      setStatus("裝置已中斷", "#95a3b8");
    }

    async function startMonitoring() {
      points = [];
      drawChart();
      setStatus("載入個人壓力資料…", "#67b2ff");
      await bootstrapHistory();
      await loadLatest();
    }

    connectBtn.addEventListener("click", connectSensor);
    disconnectBtn.addEventListener("click", disconnectSensor);
    window.addEventListener("resize", drawChart);

    drawChart();
    startMonitoring();
    if (!("serial" in navigator)) {
      setStatus("請使用最新版 Chrome 或 Edge 連接 USB 感測器", "#95a3b8");
    }
  </script>
</body>
</html>
